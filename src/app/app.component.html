<div
  class="main-container"
  [class.main-container--games]="isGamesRoute"
  [class.main-container--responsive]="isResponsiveRoute"
>
  @if (!isGamesRoute) {
    <div class="header">
      <app-header></app-header>
    </div>
  }
  <div class="content">
    <router-outlet></router-outlet>
    <app-back-to-top />
  </div>
</div>
@if (!isResponsiveRoute) {
  <div class="mobile-view">Please switch to a laptop or desktop to view this content.</div>
}
