@if (!isLoading) {
  <header class="header" [class.header--search-active]="isSearchExpanded">
    <nav class="header__globe" aria-label="Primary navigation">
      <div class="header__globe__home-slot">
        <button
          type="button"
          class="header__globe__home"
          (click)="goToHomePage()"
          aria-label="Go to home page"
        >
          <i class="bi bi-globe"></i>
          @if (currentUrl !== URL_PATH.HOME) {
            <span [ngClass]="{ 'move-right': isHomeClicked }">AWOTW</span>
          }
        </button>
      </div>
      @if (currentUrl === URL_PATH.HOME && !isSearchExpanded) {
        <button type="button" (click)="goToMapPage()">
          <span class="url-path">Map</span>
        </button>
        <button type="button" (click)="goToTimelinePage()">
          <span class="url-path">Timeline</span>
        </button>
        <button type="button" (click)="goToChartsPage()">
          <span class="url-path">Charts</span>
        </button>
      }
    </nav>
    <div class="title" [ngClass]="{ 'zoom-in-text': zoomInText }">
      @if (currentUrl === URL_PATH.HOME) {
        {{ 'Architectural Wonders of the World' | uppercase }}
      }
    </div>
    <div class="button">
      <form class="button__search-bar" role="search" (ngSubmit)="onSearch()">
        <label class="visually-hidden" for="site-search">Search architectural wonders</label>
        <button
          type="button"
          (click)="onSearchButtonClick(siteSearchInput)"
          [attr.aria-label]="isSearchExpanded ? 'Submit search' : 'Open search'"
        >
          <i class="bi bi-search"></i>
        </button>
        <input
          #siteSearchInput
          id="site-search"
          name="searchQuery"
          type="text"
          placeholder="Search..."
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchQueryChange()"
        />
      </form>
      <div class="button__games">
        <button type="button" (click)="goToGamesPage()" aria-label="Open games">
          <i class="bi bi-controller mobile-only" aria-hidden="true"></i>
          <span>Games ! !</span>
        </button>
      </div>
      <div class="button__bg-mode">
        <button
          type="button"
          (click)="onToggleBgMode()"
          [attr.aria-pressed]="isDarkMode"
          [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          @if (isDarkMode) {
            <i class="bi bi-sun"></i>
          } @else {
            <i class="bi bi-moon"></i>
          }
        </button>
      </div>
    </div>
  </header>
}
